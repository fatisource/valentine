<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be My Valentine? 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg1:#ffd6e7;--bg2:#ffe9f3;--card:#fff;--ink:#c2185b;--soft:#8e4a66;--pink:#ff4f8b;--pink2:#ff85b3;--grey:#f1e3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1022;--bg2:#3d1630;--card:#4a1c3a;--ink:#ffb3d1;--soft:#e6a4c0;--grey:#6b3558}}
:root[data-theme="dark"]{--bg1:#2a1022;--bg2:#3d1630;--card:#4a1c3a;--ink:#ffb3d1;--soft:#e6a4c0;--grey:#6b3558}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;background:radial-gradient(circle at 20% 15%,var(--bg2),var(--bg1));display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;padding:16px}
.card{position:relative;z-index:5;background:var(--card);width:min(92vw,420px);padding:34px 26px 30px;border-radius:32px;box-shadow:0 18px 50px -12px rgba(255,79,139,.45);border:4px solid var(--pink2)}
.bear{font-size:76px;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
h1{font-family:'Pacifico',cursive;font-weight:400;color:var(--ink);font-size:clamp(1.7rem,7vw,2.2rem);margin:10px 0 6px;line-height:1.3}
.sub{color:var(--soft);font-weight:600;min-height:1.6em;margin-bottom:18px}
.btns{display:flex;gap:14px;justify-content:center;align-items:center;min-height:64px}
button{font-family:inherit;font-weight:800;font-size:18px;border:none;border-radius:999px;padding:13px 28px;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
#yes{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 8px 18px -6px var(--pink);transform-origin:center}
#yes:hover{box-shadow:0 12px 24px -6px var(--pink)}
#no{background:var(--grey);color:var(--soft);z-index:20}
#no.run{position:fixed;transition:left .25s ease,top .25s ease}
.bg{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.fl{position:absolute;bottom:-60px;animation:rise linear forwards;opacity:.85}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.win{display:none;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.done .ask{display:none}.done .win{display:block}
.win h1{font-size:clamp(1.6rem,6.5vw,2.1rem)}
@media(prefers-reduced-motion:reduce){.bear,.fl{animation:none}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main class="card" id="card">
  <div class="ask">
    <div class="bear" id="bear">🧸</div>
    <h1>Will you be my Valentine?</h1>
    <p class="sub" id="sub">I made this just for you 💌</p>
    <div class="btns">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙈</button>
    </div>
  </div>
  <div class="win">
    <div class="bear">🥰</div>
    <h1>Yaaay! I got you! 💕</h1>
    <p class="sub">I love you so much, my Valentine ❤️</p>
    <div style="font-size:34px;letter-spacing:6px">💖🧸🌹🧸💖</div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const yes=$('yes'),no=$('no'),sub=$('sub'),bear=$('bear'),bg=$('bg'),card=$('card');
const faces=['🧸','🥺','😢','😭','🥹'];
const lines=['Are you sure? 🥺','Pretty please? 🌸','Don’t break my heart 💔','The Yes button is so lonely 😢','You can’t catch me… but I’ll catch you 💘','Okay, just say yes! 💖'];
let dodges=0,scale=1;

function floatHeart(emoji){
  const h=document.createElement('div');
  h.className='fl';
  h.textContent=emoji||['💖','💕','💗','🌸','✨','💘'][Math.floor(Math.random()*6)];
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(16+Math.random()*28)+'px';
  h.style.animationDuration=(4+Math.random()*4)+'s';
  bg.appendChild(h);
  setTimeout(()=>h.remove(),8500);
}
setInterval(floatHeart,700);

function dodge(e){
  if(e&&e.cancelable)e.preventDefault();
  dodges++;
  no.classList.add('run');
  const w=no.offsetWidth,h=no.offsetHeight,pad=12;
  const maxX=window.innerWidth-w-pad,maxY=window.innerHeight-h-pad;
  no.style.left=Math.max(pad,Math.random()*maxX)+'px';
  no.style.top=Math.max(pad,Math.random()*maxY)+'px';
  sub.textContent=lines[Math.min(dodges-1,lines.length-1)];
  bear.textContent=faces[Math.min(dodges,faces.length-1)];
  scale=Math.min(scale+.12,1.8);
  yes.style.transform='scale('+scale+')';
}
no.addEventListener('pointerenter',dodge);
no.addEventListener('touchstart',dodge,{passive:false});
no.addEventListener('click',dodge);

yes.addEventListener('click',()=>{
  card.classList.add('done');
  for(let i=0;i<60;i++)setTimeout(()=>floatHeart(['❤️','💖','💕','🌹','🎉'][i%5]),i*60);
  setInterval(()=>floatHeart('💖'),250);
  no.remove();
});
</script>
</body>
</html>
